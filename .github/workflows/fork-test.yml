# Fork-only: builds and tests ROS 2 packages on GitHub runners inside the image
# built by fork-image.yml (ghcr.io/<owner>/truck:<tag>).
# In the main repository the self-hosted job from test.yml is used instead.

name: Fork test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build, test (GitHub runner)
    if: github.repository != 'robotics-laboratory/truck'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - name: Resolve image name
        id: names
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          TAG=$(sed -n 's|.*image: "registry.robotics-lab.ru/truck:\(.*\)".*|\1|p' docker-compose.yaml)
          test -n "$TAG"
          echo "image=ghcr.io/${OWNER}/truck:${TAG}" | tee -a "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "${{ steps.names.outputs.image }}"

      - name: Build ROS2 packages
        run: |
          docker run --rm --entrypoint bash -v "$PWD:/truck" -w /truck \
            "${{ steps.names.outputs.image }}" \
            -c "make build-all"

      - name: Test ROS2 packages
        run: |
          docker run --rm --entrypoint bash -v "$PWD:/truck" -w /truck \
            "${{ steps.names.outputs.image }}" \
            -c "make test-all"
